# ============================================
# Create .streamlit/config.toml
# ============================================
import os
os.makedirs('.streamlit', exist_ok=True)
[theme]
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
maxUploadSize = 10
enableCORS = false
enableXsrfProtection = false
headless = true

[browser]
gatherUsageStats = false

print("✅ Config created!")
